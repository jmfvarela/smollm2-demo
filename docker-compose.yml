services:
  # ── SmolLM2 Chat API ───────────────────────────────
  smollm2-seed:
    build: .
    ports:
      - "3000:3000"
    environment:
      SMOLLM2_MODEL_ID: ${SMOLLM2_MODEL_ID:-HuggingFaceTB/SmolLM2-360M-Instruct}
    restart: unless-stopped

  # ── NextChat Web UI ─────────────────────────────────
  nextchat:
    image: yidadaa/chatgpt-next-web:latest
    ports:
      - "3001:3000"
    environment:
      OPENAI_API_KEY: none
      BASE_URL: http://smollm2-seed:3000
      CUSTOM_MODELS: smollm2
      DEFAULT_MODEL: smollm2
      HIDE_USER_API_KEY: "1"
      HIDE_BALANCE_QUERY: "1"
    restart: unless-stopped
    depends_on:
      smollm2-seed:
        condition: service_healthy

  # ── Optional: nginx reverse proxy ───────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - smollm2-seed
      - nextchat
    profiles: ["proxy"]
